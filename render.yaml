# Matches the existing web service named sonic-stream (URL slug sonic-stream-zc61).
# Dashboard should stay: Docker, Root Directory backend, branch main, health /health.
services:
  - type: web
    name: sonic-stream
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
